
      - name: Create Android platform and enable camera
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking Flutter project..."
          test -f pubspec.yaml

          # Normalize Windows line endings
          sed -i 's/\r$//' pubspec.yaml

          # Verify package name
          grep -Eq '^name:[[:space:]]*easyload_shop_manager[[:space:]]*$' pubspec.yaml

          # Verify assets
          test -d assets/provider_logos
          find assets/provider_logos -type f

          # Generate Android platform
          flutter create \
            --platforms=android \
            --org com.ilyas.easyload \
            --project-name easyload_shop_manager .

          # Enable camera permission
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '    <uses-permission android:name="android.permission.CAMERA" />\n'

          if "android.permission.CAMERA" not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permission
              )

          p.write_text(s)
          PY

          rm -rf test
